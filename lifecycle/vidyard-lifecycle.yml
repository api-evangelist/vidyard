    status: superseded
    docs: https://knowledge.vidyard.com/hc/en-us/articles/360009871054-Using-the-Vidyard-Player-API-Legacy
    note: Retained for players embedded with pre-V4 embed codes.
  - name: oEmbed v1
    status: legacy
    path: /dashboard/v1/oembed
    note: Returns the legacy embed code; v1.1 returns the responsive one.

status_page:
  url: https://status.vidyard.com/
  http_status: 200
  api_component: https://status.vidyard.com/public-api
  machine_readable: false
  note: >
    The status page is live and publicly reachable and carries a dedicated
    Public API component. It is NOT an Atlassian Statuspage — the conventional
    /api/v2/summary.json endpoint returns 403 AccessDenied, so uptime history
    cannot be read programmatically.


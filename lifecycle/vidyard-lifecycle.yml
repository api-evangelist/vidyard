versioning:
  scheme: uri-path
  current: v1
  observed: [v1, "v1.1"]
  policy_url: null
  policy_published: false
  note: >
    Version lives in the path (/dashboard/v1/...). A single v1.1 operation
    exists — GET /dashboard/v1.1/oembed — introduced to serve the responsive
    embed code alongside the v1 legacy form. Vidyard publishes no version
    policy, no supported-version window, and no migration guidance.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  mechanism: >
    Deprecation is communicated ONLY as a DEPRECATED badge rendered next to an
    operation in the HTML reference at developer.vidyard.com. There is no
    RFC 8594 Sunset header, no Deprecation header, no removal date on any
    deprecated operation, and no policy page stating how long a deprecated
    operation remains callable.
  note: >
    No `Deprecation` common[] pointer is emitted for Vidyard: badges on
    individual operations are a deprecation SIGNAL, not a deprecation POLICY,
    and the scoring check reads a published policy.


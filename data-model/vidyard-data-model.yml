distribution_targets:
  description: >
    Videos and players can be pushed to external platforms, each with its own
    operation and status endpoint.
  targets:
    - {platform: YouTube, operations: [youtube_push, youtube_push_status, youtube_repush], note: player youtube_push is DEPRECATED}
    - {platform: Facebook, operations: [facebook_push]}


generated: '2026-08-13'
method: searched
source: https://knowledge.vidyard.com/hc/en-us/articles/42909331296411-Using-the-Vidyard-Video-Agent-API
name: Vidyard API Rate Limits
description: >
  Vidyard publishes hard numeric rate limits for exactly one of its three APIs.
  The Video Agent API documents 1,000 calls per minute and 25,000 per day under
  an explicit "API Limits" heading. The Dashboard API and the Analytics Webhook
  API publish no limits at all — no numbers, no response headers, and no 429 in
  the error table on any of the 131 documented Dashboard operations. What the
  platform returns when the Video Agent limits ARE exceeded is also unstated.
url: https://knowledge.vidyard.com/hc/en-us/articles/42909331296411-Using-the-Vidyard-Video-Agent-API
created: "2026-06-12"
modified: "2026-08-13"

authentication:
  type: apiKey
  parameter: auth_token
  placement: [query, body]
  description: >
    A static, folder-scoped, role-based API token passed as the auth_token
    query parameter or body attribute. No documented expiry or rotation.
  tokenUrl: https://knowledge.vidyard.com/hc/en-us/articles/360009875814-How-to-access-your-Vidyard-API-tokens
  cross_reference: authentication/vidyard-authentication.yml

limits:
  - api: Vidyard Video Agent API
    scope: per-account
    published: true
    source: https://knowledge.vidyard.com/hc/en-us/articles/42909331296411-Using-the-Vidyard-Video-Agent-API
    quotes: "There is a limit on the number of Video Agent API calls that can be processed in certain time periods. Per day - 25,000. Per minute - 1,000."
    windows:
      - window: 1m
        limit: 1000
        unit: requests
      - window: 1d
        limit: 25000
        unit: requests
    burst: undocumented
    status_on_exhaustion: undocumented
    response_headers: undocumented
    retry_after: undocumented
    notes: >
      The only numeric limits Vidyard publishes anywhere. Note the daily cap of
      25,000 is well below 1,000/min sustained (1.44M/day), so the daily quota
      is the real constraint — it is exhausted by 25 minutes at peak rate.

  - api: Vidyard Dashboard API
    scope: undocumented
    published: false
    limit: null
    window: null
    burst: null
    status_on_exhaustion: undocumented
    response_headers: undocumented
    retry_after: undocumented
    notes: >
      No limits documented. The fixed error table repeated on all 131 operation
      pages at developer.vidyard.com lists 400, 401, 403, 404, 406 and 422 —
      429 is absent entirely, so throttling behaviour is unspecified. The only
      quota-shaped surface is the allotments resource
      (GET /dashboard/v1/organizations/:organization_id/allotments), which
      reports account usage and limits for FEATURES, not for API calls.

  - api: Vidyard Analytics Webhook API
    scope: undocumented
    published: false
    limit: null
    window: null
    burst: null
    status_on_exhaustion: undocumented
    response_headers: undocumented
    retry_after: undocumented
    notes: >
      No limits documented for the subscription-management endpoints on
      analytics-api.vidyard.com. Outbound delivery volume is driven by viewer
      event traffic and is not rate-described; note that a single full view
      emits five separate `view` payloads (0/25/50/75/100 milestones), so
      inbound volume at the receiver scales at 5x the view count.

response_headers:
  documented: false
  x_ratelimit: false
  ratelimit_standard: false
  retry_after: false
  note: >
    Vidyard documents NO rate-limit response headers of any kind — neither the
    X-RateLimit-* convention nor the RFC-draft RateLimit-* fields nor
    Retry-After. An agent has no runtime signal for remaining quota and must
    treat the published Video Agent numbers as the only budget information
    available. Headers were not observed live because every Vidyard API
    endpoint requires a token; the 406 returned by an unauthenticated
    GET https://api.vidyard.com/dashboard/v1 carried no rate-limit headers.

errorHandling:
  rateLimitExceeded: undocumented
  unauthorized: 401
  forbidden: 403
  badRequest: 400
  notAcceptable: 406
  unprocessable: 422
  notFound: 404
  retryAfterHeader: undocumented
  cross_reference: errors/vidyard-problem-types.yml

commercial_gate:
  note: >
    Vidyard's pricing page reserves API and ingestion-based integrations for
    the Enterprise tier, while the knowledge-base "Who Can Use This Feature?"
    banners list all four tiers subject to the Edit API tokens permission.
    Effective access is sales-gated.
  see: plans/vidyard-plans-pricing.yml


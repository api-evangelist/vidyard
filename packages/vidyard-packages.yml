    version: 1.1.0
    published: '2021-05-13'
    license: MIT
    description: Vidyard CLI to speed up CTA development.
    scope: cta-development
    repository: null
    repository_status: >
      package.json declares git+https://github.com/Development/vy-cli.git,
      which is not a Vidyard-owned path and does not resolve. No public source.
    evidence: >
      Scoped to the @vidyard npm org with the same maintainer set as
      @vidyard/embed-code, including the vidyard-npm-ci publisher account.
    note: >
      ABANDONMENT SIGNAL — last published 2021-05-13, over five years stale, and
      it wraps only CTA development, not the REST APIs. Not referenced from any

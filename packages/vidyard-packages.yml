    name: "@vidyard/embed-code"
    url: https://www.npmjs.com/package/@vidyard/embed-code
    install: npm install @vidyard/embed-code
    official: true
    version: 4.3.25
    published: '2026-07-28'
    license: MIT
    description: The Vidyard player embed code, also known as Embed V4.
    scope: player-embed
    repository: https://github.com/Vidyard/vidyard-player-sdk
    repository_status: >
      Declared in package.json as Vidyard/vidyard-player-sdk (directory
      packages/embed-code) but the GitHub API returns 404 for that repo — the
      monorepo is private. The published package is public; its source is not.
    evidence: >
      Scoped to the @vidyard npm org and published by the vidyard-npm-ci
      automation account alongside 13 named Vidyard maintainers. Documented by
      Vidyard at knowledge.vidyard.com ("Vidyard player embed npm package").
    note: >
      Actively maintained — released 2026-07-28, the most current first-party
      artifact Vidyard publishes anywhere.

  - language: javascript

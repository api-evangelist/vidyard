  - language: javascript
    registry: cdn
    name: Vidyard Embed v4 loader
    url: https://play.vidyard.com/embed/v4.js
    install: '<script type="text/javascript" async src="https://play.vidyard.com/embed/v4.js"></script>'
    official: true
    version: null
    published: null
    note: >
      Unpinned CDN distribution — the URL floats to whatever v4 build Vidyard
      currently serves, so a consumer cannot determine which version they load
      and neither can this pipeline. There is no jsDelivr/unpkg metadata
      endpoint for a vendor-hosted path. The major version (v4) is the only
      guarantee in the contract. Recorded as null deliberately: checked,
      nothing versioned to record.
    evidence: >

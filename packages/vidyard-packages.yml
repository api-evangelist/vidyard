method: searched
source: >
  registry.npmjs.org search + package metadata, pypi.org, rubygems.org,
  api.github.com/orgs/Vidyard, and
  https://knowledge.vidyard.com/hc/en-us/categories/360000962493-Developer-tools-resources
note: >
  Vidyard ships NO server-side API client library in any language. The two
  first-party npm packages are browser/player tooling for the embed surface,
  not SDKs for the Dashboard, Video Agent or Analytics Webhook REST APIs — a
  developer calling those APIs writes raw HTTP. This is the single largest
  ergonomics gap in Vidyard's developer surface. Registry currency was read
  from registry.npmjs.org, pypi.org and rubygems.org metadata endpoints on
  2026-08-13.

packages:
